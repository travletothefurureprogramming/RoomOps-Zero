<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRobot Dashboard</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .dashboard-container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* Banner Ενεργοποίησης Ήχου */
        .audio-unlock-banner {
            background: #f59e0b;
            color: #0f172a;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border: 2px solid #fbbf24;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .audio-unlock-banner.unlocked {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: #10b981;
            box-shadow: none;
            justify-content: center;
        }

        .btn-unlock {
            background: #0f172a;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-unlock:hover {
            background: #1e293b;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .time-widget h1 {
            font-size: 2.2rem;
            color: #38bdf8;
        }

        .time-widget p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .weather-widget #temperature {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f59e0b;
        }

        .security-status-bar {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .status-armed { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .status-disarmed { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            flex: 1;
            min-width: 120px;
        }

        .btn:hover { background-color: #1d4ed8; }
        .btn:active { transform: scale(0.98); }

        .btn-off { background-color: #dc2626; }
        .btn-off:hover { background-color: #b91c1c; }

        .btn-arm { background-color: #7c3aed; }
        .btn-arm:hover { background-color: #6d28d9; }

        .btn-disarm { background-color: #059669; }
        .btn-disarm:hover { background-color: #047857; }

        .tv-news-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-left: 4px solid #38bdf8;
            padding: 16px 20px;
            border-radius: 12px;
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .news-badge {
            background: #0284c7;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .news-headline {
            font-size: 1.15rem;
            font-weight: 500;
            color: #f1f5f9;
            line-height: 1.4;
            transition: opacity 0.5s ease-in-out;
        }

        /* Red Flash Overlay */
        .alarm-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .alarm-overlay.active {
            opacity: 1; pointer-events: auto;
            animation: redFlash 0.8s infinite continuous;
        }

        @keyframes redFlash {
            0% { background-color: rgba(220, 38, 38, 0.95); }
            50% { background-color: rgba(15, 23, 42, 0.95); }
            100% { background-color: rgba(220, 38, 38, 0.95); }
        }

        .alarm-box {
            background: #1e293b;
            border: 2px solid #ef4444;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .alarm-box h2 {
            color: #ef4444;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }

        .pin-input {
            width: 100%;
            padding: 12px;
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 8px;
            border-radius: 8px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        .pin-input:focus { border-color: #38bdf8; }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
        }

        .assistant-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #0284c7;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
            transition: all 0.3s ease;
        }

        .assistant-avatar.listening {
            background: #f59e0b;
            animation: pulse-yellow 1.2s infinite;
        }

        .assistant-avatar.speaking {
            background: #10b981;
            animation: pulse-green 0.8s infinite;
        }

        @keyframes pulse-yellow {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { transform: scale(1.15); box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">

        <div id="assistant-avatar" class="assistant-avatar">
            <span id="assistant-status" style="font-size: 0.8rem; font-weight: bold;">MARK</span>
        </div>
        
        <div id="audio-banner" class="audio-unlock-banner">
            <span>⚠️ Πατήστε για ενεργοποίηση ήχου</span>
            <button class="btn-unlock" onclick="enableAudioSystem()">ΕΝΕΡΓΟΠΟΙΗΣΗ</button>
        </div>

        <header class="top-bar">
            <div class="time-widget">
                <h1 id="clock">00:00</h1>
                <p id="date">Loading...</p>
            </div>
            <div class="weather-widget">
                <span id="temperature">--°C</span>
                <p id="location">Kavala</p>
            </div>
        </header>

        <div id="system-status-bar" class="security-status-bar status-disarmed">
            SYSTEM DISARMED
        </div>

        <div class="controls">
            <button class="btn btn-arm" onclick="armSystem()">ARM SYSTEM</button>
            <button class="btn btn-disarm" onclick="openDisarmModal()">DISARM SYSTEM</button>
        </div>

        <div class="controls">
            <button class="btn" onclick="toggleLed('turn_on')">Turn On Light</button>
            <button class="btn btn-off" onclick="toggleLed('turn_off')">Turn Off Light</button>
        </div>

        <div class="tv-news-card">
            <div class="news-header">
                <span class="news-badge">LATEST NEWS</span>
            </div>
            <div id="news-headline" class="news-headline">Φόρτωση ειδήσεων...</div>
        </div>
    </div>

    <!-- Alarm Audio -->
    <audio id="alarm-sound" src="/static/alarm.mp3" preload="auto"></audio>

    <!-- Overlay & Keypad Modal -->
    <div id="alarm-overlay" class="alarm-overlay">
        <div class="alarm-box">
            <h2>🚨 SECURITY BREACH 🚨</h2>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">Εισάγετε τον κωδικό PIN για απενεργοποίηση:</p>
            
            <input type="password" id="pin-code" class="pin-input" maxlength="8" placeholder="••••" autocomplete="off">
            <div id="pin-error" class="error-msg">Λάθος Κωδικός PIN!</div>

            <button class="btn btn-off" style="width: 100%;" onclick="submitPin()">DISARM</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;
        let lastAlertTimestamp = null;
        let isAlarmActive = false;
        let audioUnlocked = false;

        const alarmSound = document.getElementById('alarm-sound');
        const alarmOverlay = document.getElementById('alarm-overlay');
        const statusBar = document.getElementById('system-status-bar');
        const pinInput = document.getElementById('pin-code');
        const pinError = document.getElementById('pin-error');
        const audioBanner = document.getElementById('audio-banner');
        const ws = new WebSocket(`ws://${window.location.host}/ws/assistant`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'assistant_state') {
                const avatar = document.getElementById('assistant-avatar');
                const statusText = document.getElementById('assistant-status');

                avatar.className = 'assistant-avatar ' + data.state;

                if (data.state === 'listening') {
                    statusText.innerText = "Listening...";
                } else if (data.state === 'speaking') {
                    statusText.innerText = "Speaking...";
                } else {
                    statusText.innerText = "MARK";
                }
            }
        };

        function enableAudioSystem() {
            alarmSound.play().then(() => {
                alarmSound.pause();
                alarmSound.currentTime = 0;
                audioUnlocked = true;
                
                // Ενημέρωση UI Banner
                audioBanner.className = 'audio-unlock-banner unlocked';
                audioBanner.innerHTML = '<span>🔊 AUDIO SYSTEM ACTIVE</span>';
            }).catch(e => console.warn("Audio unlock error:", e));
        }

        // Κύκλος: MP3 -> English Speech -> MP3 ...
        alarmSound.onended = () => {
            if (isAlarmActive) {
                speakWarningEnglish();
            }
        };

        function speakWarningEnglish() {
            if ('speechSynthesis' in window && isAlarmActive) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance("Motion detected. Warning, security breach!");
                msg.lang = 'en-US';
                msg.rate = 1.0;
                
                msg.onend = () => {
                    if (isAlarmActive) {
                        alarmSound.currentTime = 0;
                        alarmSound.play().catch(e => console.warn(e));
                    }
                };

                window.speechSynthesis.speak(msg);
            } else if (isAlarmActive) {
                alarmSound.currentTime = 0;
                alarmSound.play().catch(e => console.warn(e));
            }
        }

        function triggerAlarmSequence() {
            isAlarmActive = true;
            alarmOverlay.classList.add('active');
            pinInput.focus();

            if (audioUnlocked) {
                alarmSound.currentTime = 0;
                alarmSound.play().catch(e => console.warn(e));
            }
        }

        function stopAlarmSequence() {
            isAlarmActive = false;
            alarmOverlay.classList.remove('active');
            alarmSound.pause();
            alarmSound.currentTime = 0;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            pinInput.value = '';
            pinError.style.display = 'none';
        }

        async function submitPin() {
            const enteredPin = pinInput.value;
            try {
                const res = await fetch(`${API_BASE_URL}/api/verify-pin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: enteredPin })
                });
                const data = await res.json();

                if (data.correct) {
                    stopAlarmSequence();
                    pollMotion();
                } else {
                    pinError.style.display = 'block';
                    pinInput.value = '';
                }
            } catch (err) {
                console.error("PIN error:", err);
            }
        }

        pinInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitPin();
        });

        async function armSystem() {
            try {
                await fetch(`${API_BASE_URL}/api/arm`, { method: 'POST' });
                pollMotion();
            } catch (err) {
                console.error("Arming error:", err);
            }
        }

        function openDisarmModal() {
            alarmOverlay.classList.add('active');
            pinInput.focus();
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        async function fetchWeather() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/weather/kavala`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                document.getElementById('temperature').innerText = `${data.temperature}°C`;
            } catch (err) {
                document.getElementById('temperature').innerText = '--°C';
            }
        }

        async function toggleLed(action) {
            try {
                await fetch(`${API_BASE_URL}/api/tapo/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device_name: 'l900', action: action })
                });
            } catch (err) {
                console.error('Light control error:', err);
            }
        }

        async function pollMotion() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/camera/check-motion`);
                if (!res.ok) return;

                const data = await res.json();

                if (data.system_armed) {
                    statusBar.innerText = "SYSTEM ARMED";
                    statusBar.className = "security-status-bar status-armed";
                } else {
                    statusBar.innerText = "SYSTEM DISARMED";
                    statusBar.className = "security-status-bar status-disarmed";
                    if (isAlarmActive) stopAlarmSequence();
                }

                if (data.system_armed && data.motion && data.timestamp !== lastAlertTimestamp) {
                    lastAlertTimestamp = data.timestamp;
                    if (!isAlarmActive) triggerAlarmSequence();
                }
            } catch (err) {
                console.warn("Polling error...");
            }
        }

        let newsArticles = [];
        let currentNewsIndex = 0;

        async function fetchNews() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/news/kavala`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                if (data.news && data.news.length > 0) {
                    newsArticles = data.news;
                    showNextNews();
                }
            } catch (err) {
                document.getElementById('news-headline').innerText = 'Εκτός σύνδεσης';
            }
        }

        function showNextNews() {
            if (newsArticles.length === 0) return;
            const headlineEl = document.getElementById('news-headline');
            headlineEl.style.opacity = 0; 
            setTimeout(() => {
                const item = newsArticles[currentNewsIndex];
                headlineEl.innerText = item.title || item;
                headlineEl.style.opacity = 1; 
                currentNewsIndex = (currentNewsIndex + 1) % newsArticles.length;
            }, 500);
        }

        setInterval(showNextNews, 12000);
        setInterval(fetchNews, 1200000);
        setInterval(updateClock, 1000);
        setInterval(fetchWeather, 600000);
        setInterval(pollMotion, 1000);

        updateClock();
        fetchWeather();
        fetchNews();
    </script>
</body>
</html>
