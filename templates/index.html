<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRobot Dashboard</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .time-widget h1 {
            font-size: 2.2rem;
            color: #38bdf8;
        }

        .time-widget p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .weather-widget #temperature {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f59e0b;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-off {
            background-color: #dc2626;
        }

        .btn-off:hover {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header class="top-bar">
            <div class="time-widget">
                <h1 id="clock">00:00</h1>
                <p id="date">Loading...</p>
            </div>
            <div class="weather-widget">
                <span id="temperature">--°C</span>
                <p id="location">Kavala</p>
            </div>
        </header>

        <div class="controls">
            <button class="btn" onclick="toggleLed('turn_on')">Turn On Light</button>
            <button class="btn btn-off" onclick="toggleLed('turn_off')">Turn Off Light</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        async function fetchWeather() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/weather/kavala`);
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                
                document.getElementById('temperature').innerText = `${data.temperature}°C`;
            } catch (err) {
                console.error('Weather error:', err);
                document.getElementById('temperature').innerText = '--°C';
            }
        }

        async function toggleLed(action) {
            try {
                const res = await fetch(`${API_BASE_URL}/api/tapo/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device_name: 'l900', action: action })
                });
                const data = await res.json();
                console.log('Action response:', data);
            } catch (err) {
                console.error('Light control error:', err);
            }
        }

        setInterval(updateClock, 1000);
        setInterval(fetchWeather, 600000);
        updateClock();
        fetchWeather();
    </script>
</body>
</html>
